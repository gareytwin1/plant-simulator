# The integrated reference plant (T5-5): supply header, feed pump, separator,
# Gas Compressor, discharge header. Two independent hydraulic domains coupled
# only through V-101's inventory (ADR 0001 D6/D7/D11) — never a shared flow
# variable, never a mixed-domain topology.
#
# V-101 is the production Vessel in configured-port mode (T5-7), wired by the
# shared-node idiom (ADR 0002 section 3.8, Amendment 3 section C.12): one node
# per phase, and V-101 takes exactly one typed port per (phase, direction).
# The liquid node N-102 carries both the feed (inlet) and the drain (outlet);
# the vapor node N-201 carries one outlet, and K-101 and PV-101 are two
# branches on that one node, not two vessel nozzles.
#
# PV-101 and LV-101 are MANUAL valves at a fixed position (ADR 0002 section
# 3.7 — M8 owns closed-loop control). PIC-101 (T8-3) is the one loop this
# fixture wires, and the engine executes it every step (T8-4) — configured
# MANUAL, so it holds PV-101 at the travel below; see the controllers key.
#
# Design values, closed-form (both pumps' and the compressor's own resistance
# are sized for this plant, not left at the class default, precisely so a
# credible cold start exists — ADR 0002 section 7.3):
#
#   Liquid — feed and drain independently solved against N-102's pressure,
#   which is always N-102's configured 50.0 psia plus the vessel's own head
#   (head_at_full 20.0 * level). At the design level 0.5 that is 60.0 psia:
#
#     feed:  25.0 - 0.002  * q^2 = 60.0 - 40.0     -> q =  50.0 GPM
#     drain: 10.0 * sqrt(60.0 - 35.0)               ->      50.0 GPM
#
#   Feed equals drain exactly at level 0.5, so the plant is already at its
#   self-regulating steady state (ADR 0002 section 2.2's mechanism) the
#   moment it is loaded — level does not have to move to get there. With
#   P-101 stopped (cold), the branch is pure resistance and the same 20 psi
#   gap it would otherwise lift now drives it backwards:
#   q = -sqrt(20.0 / 0.002) = -100.0 GPM — bounded, not a multi-thousand-GPM
#   runaway, and well inside P-101's 150 GPM rating.
#
#   Gas — V-101 has no vapor *inlet* (D6 rules out a flash calculation, so
#   nothing manufactures vapor), which means the only way vapor pressure can
#   sit at a true steady state is for K-101's and PV-101's flows to sum to
#   zero. PV-101 vents 2.0 * 0.5 * sqrt(200.0 - 100.0) = 10.0 SCFM forward, so
#   K-101 must draw the same 10.0 SCFM *backward*, out of its own discharge
#   header and into the vessel. K-101 discharges through FV-201 rather than
#   straight into the header (T7-2), so its branch is a machine and a valve
#   in series with the internal node N-204 between them — the machine
#   publishes the rise, the valve publishes the drop, and the solver owns
#   N-204's pressure:
#
#     PV-101:  1.0 * sqrt(200.0 - 100.0)                     ->  10.0 SCFM
#     K-101:   100.0 - 0.04 * signed_square(q)      \
#     FV-201:        - 0.01 * signed_square(q)       } = 305.0 - 200.0
#                                                   /   -> q = -10.0 SCFM
#
#   The 0.05 of resistance that used to sit inside K-101 alone is now split
#   0.04 machine + 0.01 valve — FV-201 is linear with capacity 20.0 at 0.5
#   travel, so K = 1 / (20.0 * 0.5)^2 = 0.01 — and the series pair still
#   totals 0.05. Every flow in this fixture is therefore exactly where T5-5
#   derived it, and N-204 sits at 200.0 + 100.0 + 0.04 * 100.0 = 304.0 psia.
#
#   This is ADR 0002 section 7.3's "K-101 reversing", named and kept credible
#   by design rather than hidden: the reversal is required by conservation
#   the moment PV-101 is open at all, and sizing the K-101/FV-201 pair to
#   0.05 in total (instead of the compressor class default 0.002) keeps both
#   the running reversal and the cold one small. Cold, the pair is pure
#   resistance against the same 105 psi gap:
#   q = -sqrt(105.0 / 0.05) = -45.83 SCFM — four times the running reversal,
#   not the multi-hundred-SCFM runaway an unsized resistance would give, and
#   still well inside K-101's own 60 SCFM rating.
#
# Both flows stay exactly at their design values for as long as the plant
# runs — there is no test-horizon trick standing in for missing physics.
nodes:
  - {id: N-101, boundary: true, pressure: 40.0, domain: liquid}
  - {id: N-102, boundary: true, pressure: 50.0, domain: liquid}
  - {id: N-103, boundary: true, pressure: 35.0, domain: liquid}
  - {id: N-201, boundary: true, pressure: 200.0, domain: gas}
  - {id: N-202, boundary: true, pressure: 305.0, domain: gas}
  - {id: N-203, boundary: true, pressure: 100.0, domain: gas}
  # Internal — K-101's discharge, upstream of FV-201. Its pressure is a
  # solver output; 304.0 is the design-point value, used as the initial
  # iterate so the first solve starts where the plant already sits.
  - {id: N-204, boundary: false, pressure: 304.0, domain: gas}
equipment:
  - tag: P-101
    type: pump
    node_in: N-101
    node_out: N-102
    design:
      speed_target: 1.0
      shutoff_pressure_rise: 25.0
      pump_resistance: 0.002
      max_flow: 150.0
  - tag: LV-101
    type: control_valve
    node_in: N-102
    node_out: N-103
    design:
      capacity: 20.0
      flow_characteristic: linear
      position: 0.5
      position_target: 0.5
  - tag: K-101
    type: compressor
    node_in: N-201
    node_out: N-204
    design:
      load_target: 1.0
      shutoff_pressure_rise: 100.0
      compressor_resistance: 0.04
      max_flow: 60.0
  - tag: FV-201
    type: control_valve
    node_in: N-204
    node_out: N-202
    design:
      capacity: 20.0
      flow_characteristic: linear
      position: 0.5
      position_target: 0.5
  - tag: PV-101
    type: control_valve
    node_in: N-201
    node_out: N-203
    design:
      capacity: 2.0
      flow_characteristic: linear
      position: 0.5
      position_target: 0.5
  - tag: V-101
    type: vessel
    ports:
      feed:      {node: N-102, phase: liquid, purpose: process, direction: inlet}
      drain:     {node: N-102, phase: liquid, purpose: drain,   direction: outlet}
      vapor_out: {node: N-201, phase: vapor,  purpose: process, direction: outlet}
    paths: []
    design:
      capacity: 2000.0
      head_at_full: 20.0
      level: 0.5
      gas_volume: 400.0
      initial_pressure: 200.0
# Limits (T9-2, app/envelope/loader.py): illustrative envelopes, not a claim
# that this plant ever excursions on its own — the design point (V-101 at
# level 0.5, K-101 discharging into N-204 at 304.0 psia, P-101 forward at
# 50.0 GPM) sits on the safe side of every bound below, so a freshly loaded
# plant reads NORMAL on all three. `trip: true` sends both lo_lo and hi_hi
# to Evaluator's TRIP severity rather than ALARM (app/envelope/loader.py);
# P-101's lo_lo is a backflow trip and needs no companion hi_hi. K-101's hi
# sits at 330.0, above the 323 psia the cold start in
# config/sequences/olefins_lite.yaml peaks at: a cold vessel holds about 295
# psia, and K-101 started against it discharges that much higher until
# PV-101 vents the headspace down. A correct start-up must not alarm.
limits:
  - {tag: V-101, variable: level, lo_lo: 0.1, lo: 0.2, hi: 0.8, hi_hi: 0.9, trip: true, deadband: 0.02}
  - {tag: K-101, variable: outlet_pressure, hi: 330.0, hi_hi: 350.0, trip: true}
  - {tag: P-101, variable: flow, lo_lo: -20.0, trip: true}
# Interlocks (T11-1, app/safety/interlocks.py): one trip per trip-rated limit
# above, at the same threshold, with one deliberate exception (P-101's
# backflow trip - see below). `condition` is a bare "tag.variable op
# threshold" expression; `actions` are opaque strings this module never
# interprets - T11-2 gives them meaning through the arbitration layer.
# `delay_s` is the operator's recovery window: how long each condition must
# persist, once it starts, before the trip latches.
#
# K-101.outlet_pressure and P-101.flow are not device attributes: the engine
# composes a single-branch device's flow and its inlet and outlet pressures
# onto its snapshot row (T9-5), so K-101.outlet_pressure is N-204's solved
# pressure and P-101.flow is B-P-101's. All three trips and all three limits
# are evaluated live.
#
# P-101's backflow limit above has no interlock twin. A stopped P-101 backflows
# at -100 GPM (this file's header derivation) - already past the -20 GPM
# trip threshold - and the only available action is P-101.stop, which cannot
# clear the condition it would respond to: with reset: auto the interlock
# just stays TRIPPED for as long as the pump is off (auto only clears once
# the condition stops being met - it does not cycle), and with reset: manual
# `reset()` correctly refuses while backflow continues. Either way a cold
# start would trip immediately and the pump could never be restarted. This is
# a plant-physics gap, not an interlock-logic one - the plant has no check
# valve yet (project_state.md's "No check valve" item, under "Known interim
# behaviour", which now also records this omission so a future check-valve
# task restores it).
interlocks:
  - tag: LSHH-101
    condition: "V-101.level >= 0.9"
    delay_s: 5.0
    actions: ["P-101.stop"]
    reset: manual
  # The low-side twin of LSHH-101: stopping the feed pump would only deepen a
  # low level, so this one closes the drain valve instead - which stops
  # drain-driven loss only. Level loss from P-101 backflowing (if it is
  # stopped, by LSHH-101 or an operator) bypasses LV-101 entirely and is the
  # same missing-check-valve gap the backflow limit above has no interlock
  # for; this trip does not cover that case either.
  - tag: LSLL-101
    condition: "V-101.level <= 0.1"
    delay_s: 5.0
    actions: ["LV-101.close"]
    reset: manual
  - tag: PSHH-101
    condition: "K-101.outlet_pressure >= 350.0"
    delay_s: 2.0
    actions: ["K-101.stop"]
    reset: manual
controllers:
  # PIC-101: holds V-101's headspace pressure by venting through PV-101.
  # pv names N-201 rather than a transmitter tag — VesselCoupling writes
  # N-201's solved pressure from V-101's own inventory every step (T5-2), so
  # it is the same number a real PT there would read, and app/controls/loader.py
  # (T8-3) resolves a controllers.pv entry against a node id for exactly this
  # reason (no instruments key exists in C3 yet — see
  # .workspace/memory/project_state.md's "Known technical debt"). sp matches
  # N-201's own design steady state (this file's header derivation).
  #
  # DIRECT-acting (ISA, T8-6): PV-101 vents N-201, so opening it lowers the
  # pressure it measures and the output must rise as that pressure rises. The
  # default, REVERSE, drives PV-101 to its floor and N-201 away from setpoint.
  #
  # Configured MANUAL: the plant's own tests pin its open-loop response to
  # valve and machine moves, which a loop in AUTO would reject. Switching the
  # reference plant to AUTO is its own decision, not a side effect of this one.
  #
  # tunable (T16-14): an operator may retune PIC-101 from its faceplate. Its
  # gains were set for a stable response, never tuned, which is exactly what
  # a trainee is meant to be able to try.
  - {tag: PIC-101, pv: N-201, sp: 200.0, out: PV-101, mode: MANUAL, action: DIRECT, kp: 0.01, ki: 0.005, kd: 0.0, tunable: true}
