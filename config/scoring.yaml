# Weighted scoring (T15-3). Edit freely - no code change needed.
#
# score = 100 * (1 - sum(weight * penalty) / sum(weight)), each penalty in [0, 1].
# Count and time penalties are value / scale, saturating at 1.0 (the scale is
# the value at which that criterion costs its full weight).
#
# A trip costs far more than a slow recovery: that is the point of the weights.
weights:
  trip_count: 40
  peak_severity: 15
  unnecessary_actions: 10
  time_outside_envelope: 10
  time_to_stabilise: 8
  alarm_count: 7
  time_to_recognise: 5
  production_lost: 5

scales:
  trip_count: 1            # one trip is already the worst case
  unnecessary_actions: 5
  time_outside_envelope_s: 300   # point-seconds
  time_to_stabilise_s: 900
  alarm_count: 10
  time_to_recognise_s: 120

# Penalty for the worst severity any variable reached.
peak_severity_penalty:
  WARNING: 0.25
  ALARM: 0.6
  TRIP: 1.0

# Shortfall (variable unit x seconds) that costs the full production_lost
# penalty, per label as given to compute_metrics. A label with no entry here
# is an error, not silently free.
production_lost_scales:
  LV-101.flow: 30000   # GPM-seconds: ten minutes with no liquid product
  LV-301.flow: 30000

# What a run on each plant tracks (T20-15), read when a scenario loads. Every
# label is <tag>.<field> on an equipment row. A plant with no entry scores on
# its action log and alarm history alone.
#   excursions  limits from the plant's own `limits` whose time out of band
#               and peak severity count
#   throughput  label -> target, in that field's unit; the shortfall below
#               the target is production lost (needs a scale above)
plants:
  olefins_lite:
    # Not P-101.flow: its lo_lo guards backflow through a stopped pump, which
    # every pump-trip scenario starts in, and has no interlock (no check valve).
    excursions: [V-101.level, K-101.outlet_pressure]
    throughput:
      LV-101.flow: 50.0   # design liquid product, GPM
  separator:
    excursions: [V-301.level, V-301.pressure]
    throughput:
      LV-301.flow: 50.0
