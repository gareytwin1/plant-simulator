# Production-style serving: Gunicorn, no dev server, no debug.
#
# Do not scale this service (`--scale`, `deploy.replicas`) and do not raise
# `workers` in gunicorn.conf.py: sessions, schedulers and the rate limiter are
# per-process, so a second process splits one browser's session across two
# plants. Scale with threads.
#
# Behind a reverse proxy, set PLANT_TRUSTED_PROXIES to the proxy's addresses or
# CIDRs (comma-separated) so the API rate limit is per client, not per proxy.
# Unset, X-Forwarded-For is ignored and every client behind the proxy shares
# one bucket. See API_TRUSTED_PROXIES in app/config.py.
services:
  plant-simulator:
    build:
      context: .
      target: runtime
    image: plant-simulator
    ports:
      - "8000:8000"
    environment:
      PLANT_TRUSTED_PROXIES: ${PLANT_TRUSTED_PROXIES:-}
    restart: unless-stopped
