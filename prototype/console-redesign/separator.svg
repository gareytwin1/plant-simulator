<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 0 508 476" role="img" aria-labelledby="separator-title" preserveAspectRatio="xMidYMid meet" class="plant-graphic">
  <title id="separator-title">Separator overview</title>
  <!-- Prototype only: the simple separator (deferred-mechanics item 7), laid
       out after the user's flash-drum reference: FC on the feed, PC on the
       vapour line, LC on the liquid line. Same binding attributes as
       static/graphics/plant.svg, so the production ProcessGraphic binds it
       unchanged. Process lines are solid; instrument lines are dotted: a
       measurement from the process to its controller, and a signal from the
       controller to its control valve's diaphragm actuator. -->
  <style>
    .plant-graphic { display: block; width: 100%; height: auto; }
    .plant-graphic text { fill: var(--text); font-family: system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
    .plant-graphic .tag { font-size: 14px; font-weight: 600; }
    .plant-graphic .note { fill: var(--text-muted); font-size: 12px; font-style: italic; }
    .plant-graphic [data-missing="true"] { fill: var(--text-muted); }
    .plant-graphic .pipe { fill: none; stroke: var(--border); stroke-width: 2; }
    .plant-graphic .body { fill: var(--surface-raised); stroke: var(--border); stroke-width: 1; }
    .plant-graphic .stem { stroke: var(--border); stroke-width: 1.5; }
    .plant-graphic .actuator { fill: var(--surface-raised); stroke: var(--border); stroke-width: 1.5; }
    .plant-graphic .liquid { fill: var(--border); fill-opacity: 0.35; stroke: none; }
    .plant-graphic .liquid-surface { fill: none; stroke: var(--border); stroke-width: 1; }
    .plant-graphic .boundary { fill: var(--text-muted); stroke: none; }
    .plant-graphic .signal { fill: none; stroke: var(--text-muted); stroke-width: 1.2; stroke-dasharray: 2 4; stroke-linecap: round; }
    .plant-graphic .ctl-balloon { fill: var(--surface-raised); stroke: var(--text); stroke-width: 1.5; }
    .plant-graphic .eq[data-band="warning"] .body { stroke: var(--alarm-low-mark); stroke-width: 1.5; }
    .plant-graphic .eq[data-band="alarm"] .body { stroke: var(--alarm-high-mark); stroke-width: 1.5; }
    .plant-graphic .eq[data-band="trip"] .body { stroke: var(--alarm-critical-mark); stroke-width: 1.5; }
    .plant-graphic [data-band-of], .plant-graphic [data-bind][data-band="warning"], .plant-graphic [data-bind][data-band="alarm"], .plant-graphic [data-bind][data-band="trip"] { font-weight: 600; }
    .plant-graphic .eq[data-band="warning"] [data-band-of], .plant-graphic [data-bind][data-band="warning"] { fill: var(--alarm-low-mark); }
    .plant-graphic .eq[data-band="alarm"] [data-band-of], .plant-graphic [data-bind][data-band="alarm"] { fill: var(--alarm-high-mark); }
    .plant-graphic .eq[data-band="trip"] [data-band-of], .plant-graphic [data-bind][data-band="trip"] { fill: var(--alarm-critical-mark); }
    .plant-graphic .vessel-level { font-size: 16px; font-weight: 500; }
  </style>

  <!-- Feed, under FIC-301. -->
  <path class="pipe" data-flow="streams.B-FV-301.flow" d="M 10 255 H 96" />
  <path class="pipe" data-flow="streams.B-FV-301.flow" d="M 124 255 H 210" />
  <g class="node">
    <rect class="boundary" x="-4" y="248" width="14" height="14" />
    <text x="3" y="236">N-301</text>
    <text x="3" y="283" data-bind="nodes.N-301.pressure" data-format="fixed:0" data-unit="psia">--</text>
  </g>
  <text x="172" y="283" data-bind="streams.B-FV-301.flow" data-unit="GPM">--</text>
  <text x="172" y="301" data-bind="streams.B-FV-302.flow" data-unit="SCFM">--</text>
  <g class="ctl" data-controller="FIC-301">
    <path class="signal" d="M 55 255 V 175 H 93" />
    <path class="signal" d="M 110 192 V 231" />
    <circle class="ctl-balloon" cx="110" cy="175" r="17" />
    <line class="ctl-divider" x1="93" y1="175" x2="127" y2="175" />
    <text x="110" y="171">FIC</text>
    <text x="110" y="187">301</text>
    <text class="ctl-mode" x="146" y="179" data-controller-mode="FIC-301">--</text>
  </g>
  <g class="eq" data-tag="FV-301">
    <path class="body" d="M 96 245 L 124 265 L 124 245 L 96 265 Z" />
    <line class="stem" x1="110" y1="255" x2="110" y2="240" />
    <path class="actuator" d="M 101 240 A 9 9 0 0 1 119 240 Z" />
    <text class="tag" x="110" y="283">FV-301</text>
    <text x="110" y="301" data-bind="equipment.FV-301.position" data-format="percent">--</text>
  </g>

  <!-- Flash drum. -->
  <g class="eq" data-tag="V-301">
    <rect class="body" x="210" y="150" width="90" height="210" rx="22" />
    <clipPath id="v301-inner"><rect x="212" y="152" width="86" height="206" rx="20" /></clipPath>
    <g clip-path="url(#v301-inner)">
      <!-- The level binding moves this inner viewport's top (y); its content
           draws the liquid surface at local y 0 and overflows downwards. -->
      <svg class="liquid-fill" x="212" y="255" width="86" height="103" overflow="visible" data-fill="equipment.V-301.level" data-y0="152" data-h0="206">
        <g class="liquid-wave">
          <path class="liquid" d="M -43 0 q 10.75 -7 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 V 220 H -43 Z" />
          <path class="liquid-surface" d="M -43 0 q 10.75 -7 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0" />
        </g>
      </svg>
    </g>
    <text class="tag" x="255" y="180">V-301</text>
    <text x="255" y="202" data-bind="equipment.V-301.pressure" data-format="fixed:0" data-unit="psia">--</text>
    <text class="vessel-level" x="255" y="300" data-bind="equipment.V-301.level" data-format="percent">--</text>
    <text x="255" y="324" data-band-of="V-301"></text>
  </g>

  <!-- Vapour, under PIC-301. -->
  <path class="pipe" data-flow="streams.B-PV-301.flow" d="M 255 150 V 100 H 356" />
  <path class="pipe" data-flow="streams.B-PV-301.flow" d="M 384 100 H 446" />
  <g class="ctl" data-controller="PIC-301">
    <path class="signal" d="M 310 100 V 30 H 353" />
    <path class="signal" d="M 370 47 V 76" />
    <circle class="ctl-balloon" cx="370" cy="30" r="17" />
    <line class="ctl-divider" x1="353" y1="30" x2="387" y2="30" />
    <text x="370" y="26">PIC</text>
    <text x="370" y="42">301</text>
    <text class="ctl-mode" x="406" y="34" data-controller-mode="PIC-301">--</text>
  </g>
  <g class="eq" data-tag="PV-301">
    <path class="body" d="M 356 90 L 384 110 L 384 90 L 356 110 Z" />
    <line class="stem" x1="370" y1="100" x2="370" y2="85" />
    <path class="actuator" d="M 361 85 A 9 9 0 0 1 379 85 Z" />
    <text class="tag" x="370" y="128">PV-301</text>
    <text x="370" y="146" data-bind="equipment.PV-301.position" data-format="percent">--</text>
    <text x="370" y="164" data-bind="streams.B-PV-301.flow" data-unit="SCFM">--</text>
  </g>
  <g class="node">
    <rect class="boundary" x="446" y="93" width="14" height="14" />
    <text x="453" y="80">N-313</text>
    <text x="453" y="128" data-bind="nodes.N-313.pressure" data-format="fixed:0" data-unit="psia">--</text>
  </g>

  <!-- Liquid, under LIC-301. -->
  <path class="pipe" data-flow="streams.B-LV-301.flow" d="M 255 360 V 400 H 356" />
  <path class="pipe" data-flow="streams.B-LV-301.flow" d="M 384 400 H 446" />
  <g class="ctl" data-controller="LIC-301">
    <path class="signal" d="M 300 300 H 353" />
    <path class="signal" d="M 370 317 V 376" />
    <circle class="ctl-balloon" cx="370" cy="300" r="17" />
    <line class="ctl-divider" x1="353" y1="300" x2="387" y2="300" />
    <text x="370" y="296">LIC</text>
    <text x="370" y="312">301</text>
    <text class="ctl-mode" x="406" y="304" data-controller-mode="LIC-301">--</text>
  </g>
  <g class="eq" data-tag="LV-301">
    <path class="body" d="M 356 390 L 384 410 L 384 390 L 356 410 Z" />
    <line class="stem" x1="370" y1="400" x2="370" y2="385" />
    <path class="actuator" d="M 361 385 A 9 9 0 0 1 379 385 Z" />
    <text class="tag" x="370" y="428">LV-301</text>
    <text x="370" y="446" data-bind="equipment.LV-301.position" data-format="percent">--</text>
    <text x="370" y="464" data-bind="streams.B-LV-301.flow" data-unit="GPM">--</text>
  </g>
  <g class="node">
    <rect class="boundary" x="446" y="393" width="14" height="14" />
    <text x="453" y="380">N-303</text>
    <text x="453" y="428" data-bind="nodes.N-303.pressure" data-format="fixed:0" data-unit="psia">--</text>
  </g>
</svg>
