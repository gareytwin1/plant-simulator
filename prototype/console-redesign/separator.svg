<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="separator-title" class="plant-graphic" preserveAspectRatio="xMidYMid meet" role="img" viewBox="-28 0 508 476"><title id="separator-title">Separator overview</title><style>.plant-graphic{display:block;width:100%;height:auto}.plant-graphic text{fill:var(--text);font-family:system-ui,sans-serif;font-size:12px;text-anchor:middle}.plant-graphic .tag{font-size:14px;font-weight:600}.plant-graphic [data-missing=true]{fill:var(--text-muted)}.plant-graphic .pipe{fill:none;stroke:var(--border);stroke-width:2}.plant-graphic .body{fill:var(--surface-raised);stroke:var(--border);stroke-width:1}.plant-graphic .actuator,.plant-graphic .stem{stroke:var(--border);stroke-width:1.5}.plant-graphic .actuator{fill:var(--surface-raised)}.plant-graphic .liquid{fill:var(--border);fill-opacity:.35;stroke:none}.plant-graphic .liquid-surface{fill:none;stroke:var(--border);stroke-width:1}.plant-graphic .boundary{fill:var(--text-muted);stroke:none}.plant-graphic .signal{fill:none;stroke:var(--text-muted);stroke-width:1.2;stroke-dasharray:2 4;stroke-linecap:round}.plant-graphic .ctl-balloon{fill:var(--surface-raised);stroke:var(--text);stroke-width:1.5}.plant-graphic .eq[data-band=warning] .body{stroke:var(--alarm-low-mark);stroke-width:1.5}.plant-graphic .eq[data-band=alarm] .body{stroke:var(--alarm-high-mark);stroke-width:1.5}.plant-graphic .eq[data-band=trip] .body{stroke:var(--alarm-critical-mark);stroke-width:1.5}.plant-graphic [data-band-of],.plant-graphic [data-bind][data-band=alarm],.plant-graphic [data-bind][data-band=trip],.plant-graphic [data-bind][data-band=warning]{font-weight:600}.plant-graphic .eq[data-band=warning] [data-band-of],.plant-graphic [data-bind][data-band=warning]{fill:var(--alarm-low-mark)}.plant-graphic .eq[data-band=alarm] [data-band-of],.plant-graphic [data-bind][data-band=alarm]{fill:var(--alarm-high-mark)}.plant-graphic .eq[data-band=trip] [data-band-of],.plant-graphic [data-bind][data-band=trip]{fill:var(--alarm-critical-mark)}.plant-graphic .vessel-level{font-size:16px;font-weight:500}</style><path d="M 10 255 H 96" class="pipe" data-flow="streams.B-FV-301.flow"/><path d="M 124 255 H 210" class="pipe" data-flow="streams.B-FV-301.flow"/><g class="node"><rect width="14" height="14" x="-4" y="248" class="boundary"/><text x="3" y="236">N-301</text><text x="3" y="283" data-bind="nodes.N-301.pressure" data-format="fixed:0" data-unit="psia">--</text></g><text x="172" y="283" data-bind="streams.B-FV-301.flow" data-unit="GPM">--</text><text x="172" y="301" data-bind="streams.B-FV-302.flow" data-unit="SCFM">--</text><g class="ctl" data-controller="FIC-301"><path d="M 55 255 V 175 H 93" class="signal"/><path d="M 110 192 V 231" class="signal"/><circle cx="110" cy="175" r="17" class="ctl-balloon"/><line x1="93" x2="127" y1="175" y2="175" class="ctl-divider"/><text x="110" y="171">FIC</text><text x="110" y="187">301</text><text x="146" y="179" class="ctl-mode" data-controller-mode="FIC-301">--</text></g><g class="eq" data-tag="FV-301"><path d="M 96 245 L 124 265 L 124 245 L 96 265 Z" class="body"/><line x1="110" x2="110" y1="255" y2="240" class="stem"/><path d="M 101 240 A 9 9 0 0 1 119 240 Z" class="actuator"/><text x="110" y="283" class="tag">FV-301</text><text x="110" y="301" data-bind="equipment.FV-301.position" data-format="percent">--</text></g><g class="eq" data-tag="V-301"><rect width="90" height="210" x="210" y="150" class="body" rx="22"/><clipPath id="v301-inner"><rect width="86" height="206" x="212" y="152" rx="20"/></clipPath><g clip-path="url(#v301-inner)"><svg width="86" height="103" x="212" y="255" class="liquid-fill" data-fill="equipment.V-301.level" data-h0="206" data-y0="152" overflow="visible"><g class="liquid-wave"><path d="M -43 0 q 10.75 -7 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 V 220 H -43 Z" class="liquid"/><path d="M -43 0 q 10.75 -7 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0 t 21.5 0" class="liquid-surface"/></g></svg></g><text x="255" y="180" class="tag">V-301</text><text x="255" y="202" data-bind="equipment.V-301.pressure" data-format="fixed:0" data-unit="psia">--</text><text x="255" y="300" class="vessel-level" data-bind="equipment.V-301.level" data-format="percent">--</text></g><path d="M 255 150 V 100 H 356" class="pipe" data-flow="streams.B-PV-301.flow"/><path d="M 384 100 H 446" class="pipe" data-flow="streams.B-PV-301.flow"/><g class="ctl" data-controller="PIC-301"><path d="M 310 100 V 30 H 353" class="signal"/><path d="M 370 47 V 76" class="signal"/><circle cx="370" cy="30" r="17" class="ctl-balloon"/><line x1="353" x2="387" y1="30" y2="30" class="ctl-divider"/><text x="370" y="26">PIC</text><text x="370" y="42">301</text><text x="406" y="34" class="ctl-mode" data-controller-mode="PIC-301">--</text></g><g class="eq" data-tag="PV-301"><path d="M 356 90 L 384 110 L 384 90 L 356 110 Z" class="body"/><line x1="370" x2="370" y1="100" y2="85" class="stem"/><path d="M 361 85 A 9 9 0 0 1 379 85 Z" class="actuator"/><text x="370" y="128" class="tag">PV-301</text><text x="370" y="146" data-bind="equipment.PV-301.position" data-format="percent">--</text><text x="370" y="164" data-bind="streams.B-PV-301.flow" data-unit="SCFM">--</text></g><g class="node"><rect width="14" height="14" x="446" y="93" class="boundary"/><text x="453" y="80">N-313</text><text x="453" y="128" data-bind="nodes.N-313.pressure" data-format="fixed:0" data-unit="psia">--</text></g><path d="M 255 360 V 400 H 356" class="pipe" data-flow="streams.B-LV-301.flow"/><path d="M 384 400 H 446" class="pipe" data-flow="streams.B-LV-301.flow"/><g class="ctl" data-controller="LIC-301"><path d="M 300 300 H 353" class="signal"/><path d="M 370 317 V 376" class="signal"/><circle cx="370" cy="300" r="17" class="ctl-balloon"/><line x1="353" x2="387" y1="300" y2="300" class="ctl-divider"/><text x="370" y="296">LIC</text><text x="370" y="312">301</text><text x="406" y="304" class="ctl-mode" data-controller-mode="LIC-301">--</text></g><g class="eq" data-tag="LV-301"><path d="M 356 390 L 384 410 L 384 390 L 356 410 Z" class="body"/><line x1="370" x2="370" y1="400" y2="385" class="stem"/><path d="M 361 385 A 9 9 0 0 1 379 385 Z" class="actuator"/><text x="370" y="428" class="tag">LV-301</text><text x="370" y="446" data-bind="equipment.LV-301.position" data-format="percent">--</text><text x="370" y="464" data-bind="streams.B-LV-301.flow" data-unit="GPM">--</text></g><g class="node"><rect width="14" height="14" x="446" y="393" class="boundary"/><text x="453" y="380">N-303</text><text x="453" y="428" data-bind="nodes.N-303.pressure" data-format="fixed:0" data-unit="psia">--</text></g></svg>