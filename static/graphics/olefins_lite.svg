<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="plant-title" class="plant-graphic" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 36 480 404"><title id="plant-title">Process overview</title><style>.plant-graphic{display:block;width:100%;height:auto;max-height:80vh}.plant-graphic text{fill:var(--text);font-family:system-ui,sans-serif;font-size:14px;text-anchor:middle}.plant-graphic .tag{font-size:15px;font-weight:700}.plant-graphic .sym{font-size:18px;font-weight:700;dominant-baseline:central}.plant-graphic [data-missing=true]{fill:var(--text-muted)}.plant-graphic .pipe{fill:none;stroke:var(--border);stroke-width:4}.plant-graphic .pipe[data-flow-dir=forward]{stroke:var(--text);stroke-dasharray:10 6;animation:plant-flow .8s linear infinite}.plant-graphic .pipe[data-flow-dir=reverse]{stroke:var(--text);stroke-dasharray:2 6;animation:plant-flow .8s linear infinite reverse}.plant-graphic .pipe[data-flow-dir=none]{stroke-width:2}@media (prefers-reduced-motion:reduce){.plant-graphic .pipe{animation:none!important}}.plant-graphic .body{fill:var(--surface-raised);stroke:var(--border);stroke-width:2}.plant-graphic .liquid{fill:var(--border);fill-opacity:.35;stroke:none}.plant-graphic .boundary{fill:var(--text-muted);stroke:none}.plant-graphic .junction{fill:var(--text)}.plant-graphic .eq[data-state=unknown] .body{stroke-dasharray:4 3}.plant-graphic .eq[data-band=warning] .body{stroke:var(--alarm-low-mark);stroke-width:4}.plant-graphic .eq[data-band=alarm] .body{stroke:var(--alarm-high-mark);stroke-width:4}.plant-graphic .eq[data-band=trip] .body{stroke:var(--alarm-critical-mark);stroke-width:4}.plant-graphic [data-band-of],.plant-graphic [data-bind][data-band=alarm],.plant-graphic [data-bind][data-band=trip],.plant-graphic [data-bind][data-band=warning]{font-weight:700}.plant-graphic .eq[data-band=warning] [data-band-of],.plant-graphic [data-bind][data-band=warning]{fill:var(--alarm-low-mark)}.plant-graphic .eq[data-band=alarm] [data-band-of],.plant-graphic [data-bind][data-band=alarm]{fill:var(--alarm-high-mark)}.plant-graphic .eq[data-band=trip] [data-band-of],.plant-graphic [data-bind][data-band=trip]{fill:var(--alarm-critical-mark)}.plant-graphic .badge{fill:var(--surface-raised);stroke:var(--border);stroke-width:1}.plant-graphic .eq[data-state=running] .badge{fill:var(--equip-running-fill);stroke:none}.plant-graphic .eq[data-state=stopped] .badge{fill:var(--equip-stopped-fill);stroke:none}.plant-graphic .eq[data-state=running] [data-state-of]{fill:var(--equip-running-on)}.plant-graphic .eq[data-state=stopped] [data-state-of]{fill:var(--equip-stopped-on)}</style><path d="M 81 90 H 38" class="pipe" data-flow="streams.B-FV-201.flow"/><path d="M 166 90 H 109" class="pipe" data-flow="streams.B-FV-201.flow"/><path d="M 280 90 H 214" class="pipe" data-flow="streams.B-K-101.flow"/><path d="M 280 90 H 336" class="pipe" data-flow="streams.B-PV-101.flow"/><path d="M 364 90 H 440" class="pipe" data-flow="streams.B-PV-101.flow"/><path d="M 280 94 V 170" class="pipe"/><circle cx="280" cy="90" r="5" class="junction"/><g class="node"><rect width="14" height="14" x="24" y="83" class="boundary"/><text x="31" y="68">N-202</text><text x="31" y="116" data-bind="nodes.N-202.pressure" data-format="fixed:0" data-unit="psia">--</text></g><g class="eq" data-tag="FV-201"><path d="M 81 80 L 109 100 L 109 80 L 81 100 Z" class="body"/><text x="95" y="62" class="tag">FV-201</text><text x="95" y="124" data-bind="equipment.FV-201.position" data-format="percent">--</text></g><g class="node"><text x="140" y="114">N-204</text><text x="140" y="130" data-bind="nodes.N-204.pressure" data-format="fixed:0" data-unit="psia">--</text></g><g class="eq" data-tag="K-101"><circle cx="190" cy="90" r="24" class="body"/><text x="190" y="90" class="sym">K</text><text x="190" y="54" class="tag">K-101</text><text x="190" y="134" data-bind="equipment.K-101.load" data-format="percent">--</text><text x="190" y="152" data-bind="equipment.K-101.flow" data-unit="SCFM">--</text><rect width="76" height="22" x="152" y="158" class="badge" rx="4"/><text x="190" y="174" data-state-of="K-101">--</text></g><g class="node"><text x="280" y="60">N-201</text><text x="280" y="76" data-bind="nodes.N-201.pressure" data-format="fixed:0" data-unit="psia">--</text></g><g class="eq" data-tag="PV-101"><path d="M 336 80 L 364 100 L 364 80 L 336 100 Z" class="body"/><text x="350" y="62" class="tag">PV-101</text><text x="350" y="124" data-bind="equipment.PV-101.position" data-format="percent">--</text><text x="350" y="142" data-bind="streams.B-PV-101.flow" data-unit="SCFM">--</text></g><g class="node"><rect width="14" height="14" x="440" y="83" class="boundary"/><text x="447" y="68">N-203</text><text x="447" y="116" data-bind="nodes.N-203.pressure" data-format="fixed:0" data-unit="psia">--</text></g><path d="M 34 300 H 96" class="pipe" data-flow="streams.B-P-101.flow"/><path d="M 144 300 H 235" class="pipe" data-flow="streams.B-P-101.flow"/><path d="M 325 320 H 366" class="pipe" data-flow="streams.B-LV-101.flow"/><path d="M 394 320 H 440" class="pipe" data-flow="streams.B-LV-101.flow"/><g class="eq" data-tag="V-101"><rect width="90" height="170" x="235" y="170" class="body" rx="16"/><rect width="86" height="166" x="237" y="172" class="liquid" data-fill="equipment.V-101.level" data-h0="166" data-y0="172" rx="14"/><text x="335" y="192" class="tag" style="text-anchor:start">V-101</text><text x="335" y="212" style="text-anchor:start" data-bind="equipment.V-101.level" data-format="percent">--</text><text x="335" y="230" style="text-anchor:start" data-bind="equipment.V-101.pressure" data-format="fixed:0" data-unit="psia">--</text></g><g class="node"><text x="190" y="274">N-102</text><text x="190" y="290" data-bind="nodes.N-102.pressure" data-format="fixed:0" data-unit="psia">--</text></g><g class="node"><rect width="14" height="14" x="20" y="293" class="boundary"/><text x="27" y="276">N-101</text><text x="27" y="330" data-bind="nodes.N-101.pressure" data-format="fixed:0" data-unit="psia">--</text></g><g class="eq" data-tag="P-101"><circle cx="120" cy="300" r="24" class="body"/><text x="120" y="300" class="sym">P</text><text x="120" y="264" class="tag">P-101</text><text x="120" y="344" data-bind="equipment.P-101.speed" data-format="percent">--</text><text x="120" y="362" data-bind="equipment.P-101.flow" data-unit="GPM">--</text><rect width="76" height="22" x="82" y="368" class="badge" rx="4"/><text x="120" y="384" data-state-of="P-101">--</text></g><g class="eq" data-tag="LV-101"><path d="M 366 310 L 394 330 L 394 310 L 366 330 Z" class="body"/><text x="380" y="292" class="tag">LV-101</text><text x="380" y="354" data-bind="equipment.LV-101.position" data-format="percent">--</text><text x="380" y="372" data-bind="streams.B-LV-101.flow" data-unit="GPM">--</text></g><g class="node"><rect width="14" height="14" x="440" y="313" class="boundary"/><text x="447" y="296">N-103</text><text x="447" y="346" data-bind="nodes.N-103.pressure" data-format="fixed:0" data-unit="psia">--</text></g></svg>