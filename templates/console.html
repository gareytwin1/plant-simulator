{% extends "base.html" %}

{% block title %}Plant Simulator - Console{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/alarms.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/connection.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/faceplate.css') }}">
{% endblock %}

{% block content %}
<div id="console" data-connection="connecting" data-interval-seconds="{{ stream_interval_seconds }}">
  <h1>Console</h1>
  <p class="connection-indicator" id="connection-indicator" role="status">CONNECTING</p>
  <section aria-labelledby="plant-heading">
    <h2 id="plant-heading">Plant</h2>
    <div id="process-graphic" data-live-value></div>
  </section>
  <section aria-labelledby="controllers-heading">
    <h2 id="controllers-heading">Controllers</h2>
    <div id="faceplates" class="faceplates"><p class="faceplate-empty">Waiting for the plant.</p></div>
  </section>
  <section aria-labelledby="alarms-heading">
    <h2 id="alarms-heading">Alarms</h2>
    <div id="alarm-banner"></div>
    <div id="alarm-summary"></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/alarms.js') }}"></script>
<script src="{{ url_for('static', filename='js/connection.js') }}"></script>
<script src="{{ url_for('static', filename='js/graphic.js') }}"></script>
<script src="{{ url_for('static', filename='js/faceplate.js') }}"></script>
<script>
  (function () {
    var consoleEl = document.getElementById("console");
    AlarmConsole.mount(
      document.getElementById("alarm-banner"),
      document.getElementById("alarm-summary"),
      { pollMs: Number(consoleEl.getAttribute("data-interval-seconds")) * 1000 }
    );
    var graphic = ProcessGraphic.mount(document.getElementById("process-graphic"), {
      url: "{{ url_for('static', filename='graphics/plant.svg') }}"
    });
    var faceplates = Faceplates.mount(document.getElementById("faceplates"));
    ConnectionMonitor.mount(consoleEl, document.getElementById("connection-indicator"), {
      intervalSeconds: Number(consoleEl.getAttribute("data-interval-seconds")),
      // Each consumer is isolated: connection.js does not guard this callback,
      // so a graphic that throws must not leave the controls on a stale snapshot.
      onSnapshot: function (snapshot) {
        try { graphic.update(snapshot); } catch (error) { console.error(error); }
        try { faceplates.update(snapshot); } catch (error) { console.error(error); }
      }
    });
  })();
</script>
{% endblock %}
